<style>

<body>
<div class="phone">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>日常 Daily</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="top-icon-btn" id="globalSearchBtn" title="全局搜索">🔍</button>
      <div class="today" id="todayLabel"></div>
    </div>
  </header>
  <main id="view"></main>
  <button class="fab" id="fab" title="AI 助手">🤖</button>
  <nav class="tabbar" id="tabbar"></nav>
  <div id="sheet"></div>
</div>
<script>
/* ============================================================
   全局错误捕获
   ============================================================ */
window.addEventListener('error', (e) => { console.error('页面错误：', e.message, e.filename, e.lineno); });
window.addEventListener('unhandledrejection', (e) => { console.error('未处理的 Promise 错误：', e.reason); });

/* ============================================================
   基础
   ============================================================ */
const DAY = Math.floor((Date.now() + 8*3600*1000) / 86400000);
const DAILY_WORD_COUNT = 5;
const PAGE_SIZE = 50;
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function fmtDate(){ const d=new Date(); return `${d.getMonth()+1}月${d.getDate()}日 星期${'日一二三四五六'[d.getDay()]}`; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function dailyPick(arr,n,salt=0){
  if(!arr||!arr.length) return [];
  let seed=(DAY*1000+salt*7919)%2147483647;
  if(seed<=0) seed+=2147483646;
  const rnd=()=>{seed=(seed*16807)%2147483647; return (seed-1)/2147483646;};
  const idx=arr.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]];}
  return idx.slice(0,n).map(i=>arr[i]);
}

/* ============================================================

/* ============================================================
   词库加载器
   ============================================================ */
const DeckLoader = {
  loaded: {},
  loading: {},
  allLoading: null,

  load(deckId){
    if (this.loaded[deckId]) return Promise.resolve(this.loaded[deckId]);
    if (this.loading[deckId]) return this.loading[deckId];

    if (window.__WORD_DECK_DATA && window.__WORD_DECK_DATA[deckId]){
      const words = window.__WORD_DECK_DATA[deckId].map(w => ({ ...w, deck: deckId }));
      this.loaded[deckId] = words;
      return Promise.resolve(words);
    }

    const meta = SEED.DECKS.find(d => d.id === deckId);
    if (!meta || !meta.file){
      this.loaded[deckId] = [];
      return Promise.resolve([]);
    }

    this.loading[deckId] = new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = meta.file;
      s.onload = () => {
        const raw = (window.__WORD_DECK_DATA && window.__WORD_DECK_DATA[deckId]) || [];
        const words = raw.map(w => ({ ...w, deck: deckId }));
        this.loaded[deckId] = words;
        resolve(words);
      };
      s.onerror = () => {
        console.warn('词库加载失败：', deckId, meta.file);
        this.loaded[deckId] = [];
        resolve([]);
      };
      document.head.appendChild(s);
    });
    return this.loading[deckId];
  },

  loadAll(){
    if (this.allLoaded()) return Promise.resolve();
    if (this.allLoading) return this.allLoading;
    this.allLoading = Promise.all(SEED.DECKS.map(d => this.load(d.id).catch(() => [])));
    return this.allLoading;
  },

  allLoaded(){
    if (!SEED.DECKS.length) return true;
    return SEED.DECKS.every(d => this.loaded[d.id] !== undefined);
  },

  get(deckId){
    if (deckId === 'all'){
      const all = [];
      SEED.DECKS.forEach(d => {
        const words = this.loaded[d.id];
        if (Array.isArray(words)) all.push(...words);
      });
      return all;
    }
    return this.loaded[deckId] || [];
  },

  findWord(wordStr){
    const map = LS.get('word-deck-map', {});
    const deckId = map[wordStr];
    if (deckId && this.loaded[deckId]){
      const found = this.loaded[deckId].find(w => w.w === wordStr);
      if (found) return found;
    }
    for (const id in this.loaded){
      const found = (this.loaded[id] || []).find(w => w.w === wordStr);
      if (found) return found;
    }
    return null;
  },

  async ensureForReview(){
    const map = LS.get('word-deck-map', {});
    const ids = new Set(Object.values(map));
    if (!ids.size){
      await this.loadAll();
      return;
    }
    await Promise.all([...ids].map(id => this.load(id).catch(() => [])));
  }
};

  getStreak(){
    const d = LS.get('streak', null);
    if (!d || typeof d !== 'object') return { count:0, last:null, best:0 };
    return { count: d.count || 0, last: d.last || null, best: d.best || d.count || 0 };
  },
  checkIn(){
    const today = todayStr();
    const y = new Date(Date.now() - 86400000);
    const yStr = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
    const d = this.getStreak();
    if (d.last === today) return d;
    const newCount = d.last === yStr ? d.count + 1 : 1;
    const best = Math.max(d.best, newCount);
    const next = { count:newCount, last:today, best };
    LS.set('streak', next);
    return next;
  },

    if (!s[key]) { s[key] = { stage:0, nextDay: DAY, wrongCount:0, rightCount:0 }; this.setSchedule(type, s); }
  },
  getDueKeys(type){
    const s = this.getSchedule(type);
    return Object.keys(s).filter(k => (s[k].nextDay || 0) <= DAY);
  },
  rateItem(type, key, rating){
    const s = this.getSchedule(type);
    const cur = s[key] || { stage:0, nextDay:DAY, wrongCount:0, rightCount:0 };
    const isEn = type === 'english';
    let nextDay;
    if (rating === 'again'){ nextDay = DAY + (isEn ? 1 : 3); cur.wrongCount = (cur.wrongCount||0) + 1; cur.stage = 0; }
    else if (rating === 'hard'){ nextDay = DAY + (isEn ? 2 : 3); cur.stage = Math.max(1, (cur.stage||0)); }
    else { nextDay = DAY + (isEn ? 5 : 7); cur.stage = Math.min(5, (cur.stage||0) + 1); cur.rightCount = (cur.rightCount||0) + 1; cur.wrongCount = 0; }
    cur.nextDay = nextDay;
    s[key] = cur;
    this.setSchedule(type, s);
  },

  addWrong(type, key, q, userAnswer, feedback){
    const list = this.getWrongBook();

    if (exist){
      exist.count = (exist.count||1) + 1;
      exist.last = Date.now();
      exist.userAnswer = userAnswer;
      exist.feedback = feedback;

const VALVE_TERMS = ['WCB','CF8','CF8M','WC6','WC9','LCB','LC3','2205','双相钢','不锈钢','碳钢','API','ASME','GB','ISO','NACE','PN','Class','PTFE','PPL','STL','石墨','螺栓','螺母','填料','垫片','阀杆','阀体','阀座','密封','内漏','外漏','卡涩','冲蚀','腐蚀','淬火','回火','正火','退火','调质','固溶','渗氮','深冷','防火','防静电','扭矩','压力','温度','介质'];
function extractKeywords(text){
  if (!text) return [];
  const found = new Set();
  const lower = text.toLowerCase();
  VALVE_TERMS.forEach(t => { if (lower.includes(t.toLowerCase())) found.add(t); });
  return [...found];
}
function localJudge(answer, reference){
  const a = (answer || '').trim();
  const ref = (reference || '').trim();
  if (!a) return { correct:false, score:0, feedback:'没有作答' };
  const al = a.toLowerCase(), rl = ref.toLowerCase();
  const parts = ref.split(/[；;，,、\/\n]+/).map(x => x.trim()).filter(Boolean);
  for (const p of parts){
    const pl = p.toLowerCase();
    if (p.length >= 2 && (al.includes(pl) || pl.includes(al)) && al.length >= 2){
      return { correct:true, score:92, feedback:'命中：' + p };
    }
  }
  if (al.length >= 2 && (rl.includes(al) || al.includes(rl))){
    return { correct:true, score:88, feedback:'意思对了' };
  }
  const keys = extractKeywords(reference);
  if (keys.length){
    const hit = keys.filter(k => al.includes(k.toLowerCase()));
    const score = Math.round(hit.length / keys.length * 100);
    if (score >= 40) return { correct:true, score, feedback:'命中关键点：' + hit.join('、') };
    return { correct:false, score, feedback:'缺少关键点：' + keys.slice(0, 4).join('、') };
  }
  const refChars = [...new Set(ref.replace(/[^\u4e00-\u9fa5]/g,''))];
  const aChars = [...new Set(a.replace(/[^\u4e00-\u9fa5]/g,''))];
  if (!refChars.length || !aChars.length) return { correct:false, score:0, feedback:'无法自动判定' };
  const overlap = aChars.filter(c => refChars.includes(c)).length;
  const ratio = overlap / Math.max(aChars.length, 1);
  return { correct: ratio >= 0.5, score: Math.round(ratio * 100), feedback: ratio >= 0.5 ? '大意接近' : '和参考答案差距较大' };
}

  async call(system, user, maxTokens, temp){
    const cfg = this.endpoints()[this.provider];
    if (!cfg || !cfg.base) throw new Error('AI 未配置');
    const r = await fetch(cfg.base, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + this.apiKey },
      body: JSON.stringify({
        model: this.model || cfg.model,
        messages: [{ role:'system', content:system }, { role:'user', content:user }],
        temperature: temp == null ? 0.4 : temp,
        max_tokens: maxTokens || 1000
      })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    return (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || null;
  },
  parseJSON(content){
    if (!content) return null;
    let json = content.trim();
    if (json.startsWith('```')) json = json.replace(/^```(?:json)?\s*/, '').replace(/```\s*$/, '');
    const i = json.indexOf('{'), j = json.lastIndexOf('}');
    if (i >= 0 && j > i) json = json.slice(i, j + 1);
    return JSON.parse(json);
  },

    const system = `你是严格的行业导师。只输出 JSON：

    const user = context ? `背景：${context}\n\n问题：${question}` : question;

let _ttsAudio = null;
function playOnlineTTS(text, lang, btn){
  try{
    if (_ttsAudio){ try{ _ttsAudio.pause(); }catch(e){} _ttsAudio = null; }
    const isZh = lang && lang.startsWith('zh');
    const type = (lang && lang === 'en-GB') ? 1 : 2;
    const url = isZh
      ? `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&le=zh`
      : `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&type=${type}`;
    const audio = new Audio(url);
    audio.crossOrigin = 'anonymous';
    _ttsAudio = audio;
    if (btn){ btn.classList.add('playing'); if (btn.dataset.busy) btn.textContent = btn.dataset.busy; }
    const cleanup = () => { if (btn){ btn.classList.remove('playing'); if (btn.dataset.idle) btn.textContent = btn.dataset.idle; } _ttsAudio = null; };
    audio.onended = cleanup;
    audio.onerror = () => { cleanup(); toast('在线朗读失败，请检查网络'); };
    audio.play().catch(err => { cleanup(); toast('播放被拦截：' + err.message); });
  }catch(e){ console.warn('在线 TTS 失败：', e); toast('朗读失败'); }
}
function stopSpeak(){
  try{ if (window.AndroidBridge && window.AndroidBridge.stopSpeak) window.AndroidBridge.stopSpeak(); }catch(e){}
  try{ if ('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
  try{ if (_ttsAudio){ _ttsAudio.pause(); _ttsAudio = null; } }catch(e){}
  document.querySelectorAll('.playing').forEach(b => {
    b.classList.remove('playing');
    if (b.dataset.idle) b.textContent = b.dataset.idle;
  });
}
function toggleSpeak(text, lang, btn){
  if (!text) return;
  const wasPlaying = btn && btn.classList.contains('playing');
  stopSpeak();
  if (wasPlaying) return;
  if (window.AndroidBridge && typeof window.AndroidBridge.speak === 'function'){
    try{
      let ok = true;
      if (typeof window.AndroidBridge.isReady === 'function') ok = window.AndroidBridge.isReady();
      if (ok){
        const spoken = window.AndroidBridge.speak(text, lang || 'en-US');
        if (spoken){
          if (btn){ btn.classList.add('playing'); if (btn.dataset.busy) btn.textContent = btn.dataset.busy; }
          const dur = Math.max(1500, text.length * (lang && lang.startsWith('zh') ? 220 : 320));
          setTimeout(() => { if (btn){ btn.classList.remove('playing'); if (btn.dataset.idle) btn.textContent = btn.dataset.idle; } }, dur);
          return;
        }
      }
    }catch(e){ console.warn('Android TTS 失败：', e); }
  }
  if ('speechSynthesis' in window && typeof SpeechSynthesisUtterance === 'function'){
    try{
      const u = new SpeechSynthesisUtterance(text);
      const accent = LS.get('voice-accent', 'en-US');
      const speed = LS.get('voice-speed', 0.85);
      u.lang = lang && lang.startsWith('zh') ? lang : accent;
      u.rate = lang && lang.startsWith('zh') ? 1 : speed;
      const v = (speechSynthesis.getVoices() || []).find(x => x.lang.replace('_','-').toLowerCase().startsWith(u.lang.toLowerCase()));
      if (v) u.voice = v;
      if (btn){ btn.classList.add('playing'); if (btn.dataset.busy) btn.textContent = btn.dataset.busy; }
      u.onend = u.onerror = () => { if (btn){ btn.classList.remove('playing'); if (btn.dataset.idle) btn.textContent = btn.dataset.idle; } };
      speechSynthesis.speak(u);
      return;
    }catch(err){ console.warn('Web Speech 失败：', err); }
  }
  playOnlineTTS(text, lang, btn);
}
function copyText(text){
  return new Promise(resolve => {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => resolve(true)).catch(() => resolve(false));
      return;
    }
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      resolve(ok);
    }catch(e){ resolve(false); }
  });
}
function openExternal(url){
  try{
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 150);
  }catch(err){ console.warn('打开链接失败：', err); toast('打开失败'); }
}

  if (t.taken){
    return `
    <div class="weekly-card">
      <div class="tag">WEEKLY TEST</div>
      <div style="margin:10px 0 12px;"><div class="weekly-score">${t.score}<small style="font-size:14px;opacity:.55;font-weight:600;">/100</small></div></div>
      <p>本周测试已完成于 ${new Date(t.takenAt).toLocaleDateString()}。</p>
      <button class="btn" style="background:rgba(255,255,255,.9);color:var(--brand);" data-act="startWeekly">重新测试</button>
    </div>`;
  }
  return `
  <div class="weekly-card">
    <div class="tag">WEEKLY TEST</div>
    <h3>本周综合测试</h3>
    <p>从你本周学过的内容里抽 ${t.words.length} 个单词 + ${t.valves.length} 条知识。答完后会给出总分。</p>
    <button class="btn" style="background:#fff;color:var(--brand);font-weight:700;" data-act="startWeekly">开始测试 →</button>
  </div>
  <div class="tip-card">💡 周测的意义不是打分，是把「以为会了」变成「真的会了」。</div>`;
}

/* ============================================================
   英语（多词库 + 懒加载）

function renderDeckLoading(msg){
  return `<div class="loading-card">
    <div style="font-size:42px;line-height:1;animation:pulse 1.4s ease-in-out infinite;">📚</div>
    <div style="font-size:14px;font-weight:750;margin-top:14px;margin-bottom:8px;">${esc(msg || '正在加载词库…')}</div>
    <div style="font-size:12px;color:var(--sub);line-height:1.7;">大词库首次加载可能需要几秒钟</div>
    <div class="progress-bar" style="margin-top:16px;"><div style="width:100%;animation:pulse 1.4s ease-in-out infinite;"></div></div>
  </div>`;
}

async function englishSection(){
  const sub = state.englishSub || 'today';
  let curDeck = state.englishDeck;

  if (curDeck !== 'all' && !SEED.DECKS.find(d => d.id === curDeck)){
    curDeck = (SEED.DECKS[0] && SEED.DECKS[0].id) || '';
    state.englishDeck = curDeck;
  }

  if (!SEED.DECKS.length){
    return `<div class="tip-card">还没有配置词库。请在 data/decks.js 里添加词库信息。</div>`;
  }

  if (curDeck === 'all'){
    if (!DeckLoader.allLoaded()){
      DeckLoader.loadAll().then(() => render()).catch(() => {});
      return renderDeckLoading('正在加载全部词库（共 ' + SEED.DECKS.length + ' 个）…');
    }
  } else {
    if (DeckLoader.loaded[curDeck] === undefined){
      DeckLoader.load(curDeck).then(() => render()).catch(e => console.error(e));
      const meta = SEED.DECKS.find(d => d.id === curDeck);
      return renderDeckLoading(`正在加载「${meta ? meta.name : curDeck}」…`);
    }
  }

  const deckWords = DeckLoader.get(curDeck);
  const learnedAll = new Set(Store.getAllLearnedEver());
  const learnedToday = new Set(Store.getLearned());

  const totalCount = curDeck === 'all'
    ? SEED.DECKS.reduce((s,d) => s + (d.count || 0), 0)
    : deckWords.length;
  const learnedCount = deckWords.filter(w => learnedAll.has(w.w)).length;
  const pct = totalCount ? Math.round(learnedCount / totalCount * 100) : 0;
  const due = Store.getDueKeys('english');

  const head = `
  <div class="card" style="background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:0;">
    <div style="font-size:11px;letter-spacing:1.5px;font-weight:750;opacity:.75;margin-bottom:8px;">ENGLISH DECK</div>
    <div style="font-size:19px;font-weight:750;margin-bottom:10px;">${SEED.DECKS.reduce((s,d)=>s+(d.count||0),0)} 词 · ${SEED.DECKS.length} 个词库</div>
    <div style="font-size:13.5px;opacity:.92;line-height:1.7;">每天 ${DAILY_WORD_COUNT} 个新词。已学 ${Store.getAllLearnedEver().length} 词。</div>
  </div>

  ${due.length ? `
  <div class="card" style="background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;">
    <div style="font-size:13px;font-weight:750;color:#92400e;margin-bottom:8px;">🔁 今日复习（${due.length} 个）</div>
    <div style="font-size:12.5px;color:#92400e;line-height:1.7;margin-bottom:12px;">间隔复习比学新词更重要。</div>
    <button class="btn" style="background:#92400e;color:#fff;width:100%;" data-act="startReview" data-type="english">开始复习 →</button>
  </div>` : ''}

  <div class="sec-title">选择词库 <span class="muted">共 ${SEED.DECKS.length} 个</span></div>
  <div class="chips" data-scroll-id="deckChips" style="align-items:stretch;">
    <button class="deck-chip ${curDeck==='all'?'on':''}" data-act="englishDeck" data-deck="all">
      <div class="dc-name">📚 全部</div>
      <div class="dc-meta">${SEED.DECKS.reduce((s,d)=>s+(d.count||0),0)} 词</div>
    </button>
    ${SEED.DECKS.map(d => {
      const isLoaded = DeckLoader.loaded[d.id] !== undefined;
      const words = DeckLoader.get(d.id);
      const learned = words.filter(w => learnedAll.has(w.w)).length;
      const meta = isLoaded ? `${learned}/${words.length}` : `${d.count} 词`;
      return `<button class="deck-chip ${curDeck===d.id?'on':''}" data-act="englishDeck" data-deck="${esc(d.id)}">
        <div class="dc-name">${d.icon || '📗'} ${esc(d.name)}</div>
        <div class="dc-meta">${meta}</div>
      </button>`;
    }).join('')}
  </div>

  <div class="card" style="padding:14px;">
    <div style="display:flex;justify-content:space-between;align-items:baseline;">
      <div style="font-size:13px;font-weight:750;">当前进度</div>
      <div style="font-size:13px;color:var(--brand);font-weight:750;">${learnedCount}/${totalCount} · ${pct}%</div>
    </div>
    <div class="progress-bar"><div style="width:${pct}%;"></div></div>
  </div>

  <div class="subtabs" style="margin-bottom:12px;">
    <button class="subtab ${sub==='today'?'on':''}" data-act="englishSub" data-sub="today">今日新词</button>
    <button class="subtab ${sub==='all'?'on':''}" data-act="englishSub" data-sub="all">全部</button>
    <button class="subtab ${sub==='learned'?'on':''}" data-act="englishSub" data-sub="learned">已学</button>
  </div>`;

  if (sub === 'today') return head + englishTodayBlock(deckWords, learnedToday, learnedAll);
  if (sub === 'all') return head + englishAllBlock(deckWords, learnedAll, learnedToday);
  if (sub === 'learned') return head + englishLearnedBlock(deckWords, learnedAll);
  return head;
}

function englishTodayBlock(deckWords, learnedToday, learnedAll){
  const newWords = deckWords.filter(w => !learnedAll.has(w.w)).slice(0, DAILY_WORD_COUNT);
  const allDone = newWords.length === 0;
  if (allDone){
    return `
    <div class="card" style="text-align:center;padding:30px 16px;">
      <div style="font-size:44px;margin-bottom:10px;">🎓</div>
      <div style="font-size:15px;font-weight:750;margin-bottom:8px;">这个词库已全部学完！</div>
      <div style="font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:14px;">换个词库，或去复习已学的单词。</div>
      <button class="btn primary" data-act="englishSub" data-sub="learned">查看已学单词</button>
    </div>`;
  }
  return `
  <div class="sec-title">今日新词 <span class="muted">${newWords.length} 个 · 点卡片标记</span></div>
  ${newWords.map((w,i) => wordCard(w, i, learnedToday.has(w.w), learnedToday.has(w.w))).join('')}
  <div class="tip-card">💡 这里显示的是「当前词库中还没学过」的前 ${DAILY_WORD_COUNT} 个词，按词表顺序排。</div>`;
}

function englishAllBlock(deckWords, learnedAll, learnedToday){
  const pageSize = state.englishPage * PAGE_SIZE;
  const visible = deckWords.slice(0, pageSize);
  const hasMore = deckWords.length > pageSize;
  return `
  <div class="card" style="padding:14px;">
    <div style="display:flex;justify-content:space-between;align-items:baseline;">
      <div style="font-size:13px;font-weight:750;">词库总览</div>
      <div style="font-size:13px;color:var(--brand);font-weight:750;">${deckWords.length} 词</div>
    </div>
  </div>
  <div class="sec-title">全部单词 <span class="muted">显示 ${visible.length}/${deckWords.length}</span></div>
  ${visible.map((w) => {
    const done = learnedAll.has(w.w);
    return `<div class="word-mini" data-word="${esc(w.w)}" data-deck="${esc(w.deck||'')}" data-act="learnWord">
      <div class="wm-check ${done?'on':''}">${done?'✓':''}</div>
      <div class="wm-word">${esc(w.w)}</div>
      <div class="wm-cn">${esc(w.cn||'')}</div>
      <button class="top-icon-btn" style="width:30px;height:30px;border-radius:9px;font-size:13px;" data-act="speak" data-text="${esc(w.w)}" data-lang="en-US" onclick="event.stopPropagation();">🔊</button>
    </div>`;
  }).join('')}
  ${hasMore ? `<button class="load-more" data-act="englishLoadMore">加载更多（还有 ${deckWords.length - pageSize} 个）</button>` : ''}
  <div class="tip-card">💡 点单词左侧圆圈标记已学。点 🔊 听发音。全部学完后，复习队列会自动加入。</div>`;
}

function englishLearnedBlock(deckWords, learnedAll){
  const list = deckWords.filter(w => learnedAll.has(w.w));
  if (!list.length){
    return `<div class="tip-card">这个范围还没有学过任何单词。去「今日新词」或「全部」开始学习吧。</div>`;
  }
  const pageSize = state.englishPage * PAGE_SIZE;
  const visible = list.slice(0, pageSize);
  const hasMore = list.length > pageSize;
  return `
  <div class="sec-title">已学单词 <span class="muted">${list.length} 个</span></div>
  ${visible.map((w, i) => wordCard(w, i, true)).join('')}
  ${hasMore ? `<button class="load-more" data-act="englishLoadMore">加载更多（还有 ${list.length - pageSize} 个）</button>` : ''}`;
}

function wordCard(w, i, isDone, isDoneToday){
  return `<div class="card" data-word="${esc(w.w)}" data-deck="${esc(w.deck||'')}" style="position:relative;${isDone?'opacity:.7':''}">
    <div style="display:flex;align-items:flex-start;gap:12px;cursor:pointer" data-act="learnWord">
      <div style="width:26px;height:26px;border-radius:50%;background:${isDone?'var(--brand)':'#f0f1f8'};color:${isDone?'#fff':'#8a90a6'};display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:2px;">${isDone?'✓':i+1}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
          <span class="word-big">${esc(w.w)}</span>
          ${w.pos ? `<span style="font-size:11px;color:var(--brand);background:#eef0ff;padding:2px 7px;border-radius:6px;font-weight:700;">${esc(w.pos)}</span>` : ''}
          ${isDoneToday ? '<span style="font-size:10.5px;color:#047857;background:#ecfdf5;padding:1px 6px;border-radius:5px;font-weight:650;">今日</span>' : ''}
        </div>
        <div class="word-ph">${esc(w.ph||'')}</div>
      </div>
    </div>
    <div style="font-size:14px;color:#333a4d;margin-top:10px;font-weight:600;line-height:1.55;">${esc(w.cn||'')}</div>
    ${w.scene ? `<div style="margin-top:11px;padding-top:11px;border-top:1px dashed #eceef4;">
      <div style="display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:#2b3244;line-height:1.55;">
        <span style="flex:1">${esc(w.scene)}</span>
        <button style="border:0;background:#f3f4fa;width:26px;height:26px;border-radius:9px;font-size:12px;cursor:pointer;flex-shrink:0;" data-act="speak" data-text="${esc(w.scene)}" data-lang="en-US">🔊</button>
      </div>
      <div style="font-size:12.5px;color:var(--sub);margin-top:5px;">${esc(w.sceneCn||'')}</div>
    </div>` : ''}
    <button style="position:absolute;top:14px;right:14px;border:0;background:#f3f4fa;width:34px;height:34px;border-radius:11px;font-size:15px;cursor:pointer;" data-act="speak" data-text="${esc(w.w)}" data-lang="en-US">🔊</button>
  </div>`;
}

function valveSection(){
  const q = state.searchQuery || '';
  const cat = state.valveCat || '全部';
  let list = [];
  if (q.trim()){
    list = SEED.VALVE_ALL.filter(v =>
      v.q.toLowerCase().includes(q.toLowerCase()) ||
      v.a.toLowerCase().includes(q.toLowerCase()) ||
      (v.key||'').toLowerCase().includes(q.toLowerCase()) ||
      v.cat.toLowerCase().includes(q.toLowerCase())
    );
  } else if (cat === '全部'){
    list = dailyPick(SEED.VALVE_ALL, 5, 91);
  } else {
    list = SEED.VALVE[cat] || [];
  }
  const due = Store.getDueKeys('work');
  const wrongBook = Store.getWrongBook().filter(x => x.type === 'work');
  const cats = ['全部', ...Object.keys(SEED.VALVE)];
  const loaded = DATA_STATUS.valveOk;
  return `
  <div class="card" style="background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:0;">
    <div style="font-size:11px;letter-spacing:1.5px;font-weight:750;opacity:.75;margin-bottom:8px;">VALVE KNOWLEDGE</div>
    <div style="font-size:19px;font-weight:750;margin-bottom:10px;">${SEED.VALVE_ALL.length} 条专业知识</div>
    <div style="font-size:13.5px;opacity:.92;line-height:1.7;">${cats.length - 1} 大类 ${loaded ? '· 数据已加载' : '· 使用内置数据'}</div>
  </div>
  ${!loaded ? `<div class="tip-card" style="background:#fef3c7;border-color:#fde68a;color:#92400e;">⚠️ valve.js 未加载成功，当前使用内置的 ${SEED.VALVE_ALL.length} 条数据。</div>` : ''}
  ${due.length ? `
  <div class="card" style="background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;">
    <div style="font-size:13px;font-weight:750;color:#92400e;margin-bottom:8px;">🔁 巩固旧知识（${due.length} 条待复习）</div>
    <button class="btn" style="background:#92400e;color:#fff;width:100%;" data-act="startReview" data-type="work">开始复习 →</button>
  </div>` : ''}
  ${wrongBook.length ? `
  <div class="card" style="background:linear-gradient(135deg,#fef2f2,#fee2e2);border:1px solid #fca5a5;">
    <div style="font-size:13px;font-weight:750;color:#b91c1c;margin-bottom:8px;">📕 错题本（${wrongBook.length} 条）</div>
    <button class="btn" style="background:#b91c1c;color:#fff;width:100%;" data-act="reviewWrong">复习错题 →</button>
  </div>` : ''}
  <div class="search-box">
    <span style="font-size:15px;opacity:.5;">🔍</span>
    <input type="search" class="search-input" id="valveSearch" placeholder="搜索：WCB / API 600 / 填料外漏…" value="${esc(q)}">
    ${q ? '<button class="search-clear" data-act="searchClear">✕</button>' : ''}
  </div>
  <div class="chips" data-scroll-id="valveCat">
    ${cats.map(c => `<button class="chip ${c===cat&&!q.trim()?'on':''}" data-act="valveCat" data-cat="${esc(c)}">${esc(c)}${c!=='全部'?` · ${(SEED.VALVE[c]||[]).length}`:''}</button>`).join('')}
  </div>
  <div class="sec-title">${q.trim() ? `搜索结果 (${list.length})` : (cat==='全部' ? '今天推荐' : cat + ' · ' + list.length + ' 条')} <span class="muted">点卡片展开</span></div>
  ${list.length ? list.map((v,i) => knowCard(v, i)).join('') : '<div class="tip-card">没有找到。试试别的关键词。</div>'}`;
}

/* knowCard —— 注意：卡片、按钮都有 data-q，所以按钮的事件处理要用 .know 定位外层 */
function knowCard(v, i){
  const open = state.openKnow === v.q;
  const note = Store.getNote(v.q);
  const askCache = LS.get('ask-cache:' + v.q, null);
  const askText = LS.get('ask-text:' + v.q, '');
  const isLoading = state.aiLoading && state.aiAnsweringFor === v.q;
  const hasAsk = askCache && askCache.answer;
  return `<div class="card know ${open?'open':''}" data-q="${esc(v.q)}">
    <div style="cursor:pointer" data-act="knowToggle">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div style="flex:1;min-width:0;">
          <div class="know-cat">${esc(v.cat)}${note?'<span style="display:inline-block;margin-left:6px;font-size:11px;color:var(--brand);font-weight:600;background:#eef0ff;padding:1px 6px;border-radius:5px;">📝</span>':''}${hasAsk?'<span style="display:inline-block;margin-left:6px;font-size:11px;color:#b45309;font-weight:600;background:#fef3c7;padding:1px 6px;border-radius:5px;">💬</span>':''}</div>
          <div class="know-q">${esc(v.q)}</div>
        </div>
        <span style="font-size:12px;color:var(--sub);flex-shrink:0;">${open?'▴':'▾'}</span>
      </div>
    </div>
    <div class="know-body">
      <div class="know-a">${esc(v.a)}</div>
      <div class="know-key">${esc(v.key)}</div>
      <div class="qa-block">
        <div class="qa-label">💬 有不懂的地方？问 AI</div>
        <textarea class="qa-input" data-qa-q="${esc(v.q)}" placeholder="例如：这个能用在 300℃ 的蒸汽管道上吗？">${esc(askText)}</textarea>
        <div class="qa-row">
          <button class="qa-btn" data-act="askAbout" data-q="${esc(v.q)}" ${isLoading?'disabled':''}>${isLoading?'⏳ 思考中…':'问 AI'}</button>
          ${hasAsk?`<button class="qa-btn ghost" data-act="saveAskToNote" data-q="${esc(v.q)}">📝 记入笔记</button><button class="qa-btn ghost" data-act="clearAsk" data-q="${esc(v.q)}">清除</button>`:''}
        </div>
        ${hasAsk ? `<div class="qa-answer"><div class="qa-answer-head">🤖 AI 解答</div><div class="qa-answer-body">${esc(askCache.answer)}</div></div>` : ''}
        ${!AI.enabled() && !hasAsk ? `<div style="font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.6;">⚠️ 未配置 AI。去「我的」页填入 API Key 后即可提问。</div>` : ''}
      </div>
      <div class="note-block">
        <div class="note-label">📝 我的笔记</div>
        <textarea class="note-input" data-note-q="${esc(v.q)}" placeholder="记录你的理解、经验、疑问…">${esc(note)}</textarea>
      </div>
      <button class="btn ghost wide" style="margin-top:14px;" data-act="knowDone" data-q="${esc(v.q)}">标记为已掌握</button>
    </div>
  </div>`;
}

function renderGradeCard(g){
  if (!g) return '';
  if (g.error){
    return `<div class="score-card" style="background:#fef3c7;border-color:#fde68a;"><div style="font-size:13px;color:#92400e;line-height:1.7;">⚠️ ${esc(g.error)}</div></div>`;
  }
  const score = g.score || 0;
  const level = g.level || (score >= 85 ? '优秀' : score >= 70 ? '良好' : score >= 55 ? '合格' : '待提升');
  return `<div class="score-card">
    <div class="score-head">
      <div class="score-num">${score}<span style="font-size:14px;opacity:.55;font-weight:600;letter-spacing:0;margin-left:2px;">/100</span></div>
      <div class="score-label">${esc(level)} · AI 评分</div>
    </div>
    ${g.strengths && g.strengths.length ? `<div class="score-row"><div class="score-row-title" style="color:var(--ok)">✅ 优点</div><ul class="score-list">${g.strengths.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>` : ''}
    ${g.issues && g.issues.length ? `<div class="score-row"><div class="score-row-title" style="color:var(--warn)">⚠️ 可以改进</div><ul class="score-list">${g.issues.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>` : ''}
    ${g.improved ? `<div class="score-row"><div class="score-row-title">✍️ 修改后的版本</div><div class="score-extra">${esc(g.improved)}</div></div>` : ''}
    ${g.advice ? `<div class="score-row"><div class="score-row-title">💡 一句话建议</div><div style="font-size:13px;color:#065f46;font-style:italic;">"${esc(g.advice)}"</div></div>` : ''}
  </div>`;
}

  work:`<div class="sk" style="height:140px"></div><div class="sk" style="height:44px;border-radius:14px"></div><div class="sk" style="height:180px"></div>`,
  discover:`<div class="sk" style="height:140px"></div><div class="sk" style="height:44px;border-radius:14px"></div><div class="sk" style="height:200px"></div>`,
  me:`<div class="sk" style="height:180px"></div><div class="sk" style="height:200px"></div>`
};
const chipsScrollMemory = {};
function renderTabs(){
  tabbar.innerHTML = TABS.map(t => `<button class="tab ${t.id===state.tab?'on':''}" data-tab="${t.id}"><span class="tab-icon">${t.icon}</span><span class="tab-label">${t.label}</span></button>`).join('');
}
let renderToken = 0;
async function render(){
  const token = ++renderToken;
  const tab = state.tab;
  document.querySelectorAll('[data-scroll-id]').forEach(el => { chipsScrollMemory[el.dataset.scrollId] = el.scrollLeft; });
  renderTabs();
  updateTopbar();
  view.scrollTop = 0;
  view.innerHTML = SKELETON[tab] || '<div class="sk" style="height:200px"></div>';
  let html;
  try{ html = await VIEWS[tab](); }
  catch(e){ console.error(e); html = `<div class="tip-card">加载失败：${esc(e.message)}</div>`; }
  if (token !== renderToken || state.tab !== tab) return;
  view.innerHTML = html;
  requestAnimationFrame(() => {
    document.querySelectorAll('[data-scroll-id]').forEach(el => {
      const saved = chipsScrollMemory[el.dataset.scrollId];
      if (saved !== undefined) el.scrollLeft = saved;
    });
  });
}

function sheetHTML(html){ return `<div class="sheet-mask" data-act="closeSheet"></div><div class="sheet-body">${html}</div>`; }
function openSheet(html){
  sheet.classList.remove('open');
  sheet.innerHTML = sheetHTML(html);
  requestAnimationFrame(() => sheet.classList.add('open'));
}
function updateSheet(html){
  const body = sheet.querySelector('.sheet-body');
  if (body && sheet.classList.contains('open')) body.innerHTML = html;
  else openSheet(html);
}
function closeSheet(){
  sheet.classList.remove('open');
  state.review = null;
  setTimeout(() => { if (!sheet.classList.contains('open')) sheet.innerHTML = ''; }, 320);
}

function startReview(type, list){

function startWeeklyTest(){
  const t = Store.getWeeklyTest();
  const list = [...t.words.map(w => ({ ...w, _type:'english' })), ...t.valves.map(v => ({ ...v, _type:'work' }))];
  if (!list.length){ toast('本周还没有内容'); return; }
  state.review = { type:'weekly', list, index:0, answer:'', result:null, judged:false, loading:false, history:[] };
  renderReviewSheet();
}
function renderReviewSheet(){
  const r = state.review;
  if (!r) return;
  if (r.index >= r.list.length){
    const correct = r.history.filter(h => h.correct).length;
    const score = Math.round(correct / r.list.length * 100);
    if (r.type === 'weekly') Store.saveWeeklyResult({ score });
    updateSheet(`
      <div class="sheet-head"><div class="sheet-emoji">🎉</div><div><h2>复习完成</h2><div class="muted">共 ${r.list.length} 题 · 答对 ${correct} 题 · 得分 ${score}</div></div></div>
      <div class="sheet-sec"><h4>本轮结果</h4>
        ${r.history.map(h => `<div style="padding:9px 0;border-bottom:1px dashed #eceef4;">
          <div style="font-size:13.5px;font-weight:650;color:${h.correct?'#047857':'#b45309'};line-height:1.5;">${h.correct?'✓':'✗'} ${esc(h.q)}</div>
          ${h.feedback?`<div style="font-size:12.5px;color:${h.correct?'#047857':'#b45309'};margin-top:4px;line-height:1.6;">${esc(h.feedback)}</div>`:''}
        </div>`).join('')}
      </div>
      <button class="btn primary wide" style="margin-top:20px" data-act="closeSheet">完成</button>
    `);
    return;
  }
  const item = r.list[r.index];
  const isEn = (r.type === 'english') || (r.type === 'weekly' && item._type === 'english');
  const q = isEn ? item.w : item.q;
  const ref = isEn ? item.cn : (item.a + '\n\n要点：' + (item.key||''));
  const body = `
    <div class="sheet-head">
      <div class="sheet-emoji">${isEn ? '🔤' : '⚙️'}</div>
      <div style="flex:1;min-width:0;">
        <h2 style="font-size:16px;">${r.type === 'weekly' ? '周测' : (isEn ? '英语单词复习' : '阀门知识复习')}</h2>
        <div class="muted">第 ${r.index + 1} / ${r.list.length} 题</div>
      </div>
    </div>
    <div style="background:#f8f9fd;border-radius:14px;padding:16px;margin:14px 0;">
      <div style="font-size:11px;font-weight:750;color:var(--brand);letter-spacing:.6px;margin-bottom:8px;">${isEn ? '🔊 听发音，写出中文意思' : '题目'}</div>
      ${isEn ? `<div style="font-size:28px;font-weight:850;letter-spacing:-.6px;color:#2b3244;margin-bottom:8px;">${esc(q)}</div>
        <button class="btn ghost" data-act="reviewSpeak" data-text="${esc(q)}" data-lang="en-US">🔊 再听一遍</button>`
        : `<div style="font-size:15.5px;font-weight:750;line-height:1.5;color:#2b3244;">${esc(q)}</div>`}
    </div>
    <div style="font-size:13px;font-weight:700;color:#3b4256;margin-bottom:8px;">${isEn ? '你的中文翻译' : '你的答案'}</div>
    <textarea class="answer-input" id="reviewAnswer" placeholder="${isEn ? '写出这个单词的中文意思…' : '写下你的答案…'}" ${r.judged?'readonly':''}>${esc(r.answer||'')}</textarea>
    ${r.judged && r.result ? `
      <div class="score-card" style="${r.result.correct?'':'background:#fff7ed;border-color:#fdba74;'}">
        <div class="score-head">
          <div class="score-num" style="${r.result.correct?'':'color:#c2410c;'}">${r.result.accuracy || r.result.score || 0}<span style="font-size:14px;opacity:.55;font-weight:600;letter-spacing:0;margin-left:2px;">%</span></div>
          <div class="score-label" style="${r.result.correct?'':'color:#c2410c;'}">${r.result.correct ? '✓ 正确' : '✗ 再想想'}</div>
        </div>
        ${r.result.correct_points && r.result.correct_points.length ? `<div class="score-row"><div class="score-row-title" style="color:var(--ok);">✅ 正确点</div><ul class="score-list">${r.result.correct_points.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>` : ''}
        ${r.result.missing && r.result.missing.length ? `<div class="score-row"><div class="score-row-title" style="color:var(--warn);">⚠️ 不足 / 遗漏</div><ul class="score-list">${r.result.missing.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>` : ''}

      </div>

      ${r.loading ? `<button class="btn primary wide" disabled>⏳ AI 判定中…</button>`

      ${AI.enabled() ? '由 AI 判定对错' : '未配置 AI，使用本地关键词判定'}
    </div>`;
  updateSheet(body);
  if (isEn && !r.judged && !r.answer){
    setTimeout(() => {
      if (state.review && state.review.index === r.index && !state.review.judged) toggleSpeak(q, 'en-US');
    }, 350);
  }
}
async function submitReviewAnswer(){
  const r = state.review;
  if (!r || r.loading) return;
  const ta = document.getElementById('reviewAnswer');
  const answer = (ta && ta.value || '').trim();
  if (!answer){ toast('先写下你的答案'); return; }
  r.answer = answer;
  const item = r.list[r.index];
  const isEn = (r.type === 'english') || (r.type === 'weekly' && item._type === 'english');
  const q = isEn ? item.w : item.q;
  const ref = isEn ? item.cn : (item.a + '\n\n要点：' + (item.key||''));
  r.loading = true;
  renderReviewSheet();
  let result = null;
  if (AI.enabled()){
    try{
      if (isEn){
        const jr = await AI.judgeWord(q, answer, ref);
        if (jr) result = { correct:!!jr.correct, accuracy:jr.score || (jr.correct?90:30), score:jr.score, feedback:jr.feedback };
      } else {
        const sr = await AI.scoreAnswer(q, answer, ref);
        if (sr) result = { correct:(sr.accuracy||0) >= 60, accuracy:sr.accuracy||0, correct_points:sr.correct||[], missing:sr.missing||[], supplement:sr.supplement||'', keywords:sr.keywords||[] };
      }
    }catch(e){ console.warn('AI 失败：', e); }
  }
  if (!result){
    const lj = localJudge(answer, ref);
    result = { correct:lj.correct, accuracy:lj.score, score:lj.score, feedback:lj.feedback };
  }
  r.loading = false;
  r.judged = true;
  r.result = result;
  r.history.push({ q, correct:!!result.correct, feedback: result.feedback || (result.correct ? '答对了' : '再看一遍参考答案') });
  if (!result.correct) Store.addWrong(r.type === 'weekly' ? (item._type||'work') : r.type, item.w || item.q, q, answer, result.feedback || '');
  renderReviewSheet();
  toast(result.correct ? '✓ 答对了' : '✗ 已加入错题本');
}
function rateAndNext(rating){
  const r = state.review;
  if (!r) return;
  const item = r.list[r.index];
  const key = item.w || item.q;
  const type = r.type === 'weekly' ? (item._type || 'work') : r.type;
  Store.rateItem(type, key, rating);
  if (rating !== 'again') Store.removeWrong(type, key);
  r.index += 1;
  r.answer = '';
  r.result = null;
  r.judged = false;
  renderReviewSheet();
}

function openGlobalSearch(){
  openSheet(`
    <div class="sheet-head">
      <div class="sheet-emoji">🔍</div>

        <h2>全局搜索</h2>

async function runGlobalSearch(q){
  const el = document.getElementById('globalSearchResults');
  if (!el) return;
  q = (q || '').trim();
  if (!q){ el.innerHTML = ''; return; }
  const lq = q.toLowerCase();

  const results = [];
  SEED.VALVE_ALL.forEach(v => {
    if (v.q.toLowerCase().includes(lq) || v.a.toLowerCase().includes(lq) || (v.key||'').toLowerCase().includes(lq)){
      results.push({ type:'valve', typeLabel:'知识', q:v.q, snippet:v.a.slice(0, 80) });
    }
  });

  if (!DeckLoader.allLoaded()){
    el.innerHTML = `<div style="text-align:center;padding:20px 0;font-size:12.5px;color:var(--sub);">正在加载全部词库以搜索…</div>`;
    renderResults(results);
    await ensureAllDecksLoaded();
    if (document.getElementById('globalSearchInput')){
      return runGlobalSearch(q);
    }
    return;
  }

  const allWords = DeckLoader.get('all');
  allWords.forEach(w => {
    if (w.w.toLowerCase().includes(lq) || (w.cn||'').includes(q)){
      results.push({ type:'word', typeLabel:'单词', q:w.w, snippet: (w.cn||'') + (w.deck ? ' · ' + w.deck : '') });
    }
  });

  renderResults(results);
}
function renderResults(results){
  const el = document.getElementById('globalSearchResults');
  if (!el) return;
  if (!results.length){ el.innerHTML = `<div style="font-size:12.5px;color:var(--sub);text-align:center;padding:20px 0;">没有找到匹配结果</div>`; return; }
  state.currentSearch = results;
  el.innerHTML = results.slice(0, 50).map((r, i) => `
    <div class="search-result" data-act="globalSearchJump" data-type="${r.type}" data-idx="${i}">
      <span class="search-result-type type-${r.type}">${r.typeLabel}</span>
      <div class="search-result-q">${esc(r.q)}</div>
      <div class="search-result-snippet">${esc(r.snippet)}</div>
    </div>
  `).join('');
}
function handleSearchJump(type, idx){
  const r = (state.currentSearch || [])[idx];
  if (!r) return;
  if (type === 'valve'){
    state.tab = 'study';
    state.studySub = 'valve';
    state.searchQuery = r.q;
    state.openKnow = r.q;
    closeSheet();
    render();
  } else if (type === 'word'){
    const map = LS.get('word-deck-map', {});
    const deckId = map[r.q];
    if (deckId){ state.englishDeck = deckId; LS.set('english-deck', deckId); }
    state.tab = 'study';
    state.studySub = 'english';
    state.englishSub = 'all';
    state.englishPage = 1;
    closeSheet();
    render();
  }
}

    if (chat) chat.scrollTop = chat.scrollHeight;

async function sendAIMessage(){
  const input = document.getElementById('aiInput');
  const q = (input && input.value || '').trim();
  if (!q) return;
  if (!AI.enabled()){ toast('请先在「我的」页配置 AI'); return; }
  Store.addAIHistory('user', q);
  state.aiInput = '';
  state.aiLoading = true;
  openAIAssistant();
  try{
    const answer = await AI.assistant(q, state.aiRole);
    Store.addAIHistory('bot', answer || '（没有返回内容）');
  }catch(e){
    Store.addAIHistory('bot', '调用失败：' + (e.message || '未知错误'));
  }
  state.aiLoading = false;
  openAIAssistant();
}

/* ============================================================
   事件
   ============================================================ */
let searchTimer = null;
view.addEventListener('input', (e) => {
  const el = e.target;
  if (!el) return;
  if (el.id === 'valveSearch'){
    const val = el.value, pos = el.selectionStart;
    state.searchQuery = val;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => {
      await render();
      const newEl = document.getElementById('valveSearch');
      if (newEl){ newEl.focus(); try { newEl.setSelectionRange(pos, pos); } catch(err){} }
    }, 200);
    return;
  }
  if (el.dataset && el.dataset.noteQ){ Store.setNote(el.dataset.noteQ, el.value); return; }
  if (el.dataset && el.dataset.qaQ){ LS.set('ask-text:' + el.dataset.qaQ, el.value); return; }
  if (el.dataset && el.dataset.newsThink){ LS.set(el.dataset.newsThink, el.value); return; }
  if (el.dataset && el.dataset.thinkAns){ Store.setThinkAns(el.dataset.thinkAns, el.value); return; }
});

view.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;

  if (act === 'speak'){ e.stopPropagation(); toggleSpeak(t.dataset.text, t.dataset.lang || 'en-US', t); return; }

  if (act === 'studySub'){ state.studySub = t.dataset.sub; render(); return; }
  if (act === 'englishSub'){ state.englishSub = t.dataset.sub; state.englishPage = 1; render(); return; }
  if (act === 'englishDeck'){
    state.englishDeck = t.dataset.deck;
    LS.set('english-deck', state.englishDeck);
    state.englishPage = 1;
    render();
    return;
  }
  if (act === 'englishLoadMore'){ state.englishPage += 1; render(); return; }
  if (act === 'loadDeck'){
    const id = t.dataset.deck;
    toast('加载中…');
    DeckLoader.load(id).then(() => { toast('已加载'); render(); });
    return;
  }
  if (act === 'workSub'){ state.workSub = t.dataset.sub; render(); return; }
  if (act === 'discoverSub'){ state.discoverSub = t.dataset.sub; render(); return; }

  if (act === 'taskJump'){
    const key = t.dataset.key;
    if (key === 'words'){ state.studySub = 'english'; state.englishSub = 'today'; }
    else if (key === 'valve') state.studySub = 'valve';
    else if (key === 'passage' || key === 'expr') state.studySub = 'express';
    else if (key === 'logic') state.studySub = 'logic';
    else if (key === 'news'){ state.tab = 'discover'; state.discoverSub = 'news'; }
    render();
    return;
  }

  if (act === 'learnWord'){
    const card = t.closest('[data-word]');
    const w = card.dataset.word;
    const deck = card.dataset.deck;
    const learned = Store.getLearned();
    const i = learned.indexOf(w);
    if (i < 0){
      learned.push(w);
      Store.ensureSchedule('english', w);
      if (deck) Store.setWordDeck(w, deck);
    } else {
      learned.splice(i,1);
    }
    Store.setLearned(learned);
    render();
    toast(i < 0 ? '已标记为已学' : '已取消');
    return;
  }

  if (act === 'knowToggle'){
    const card = t.closest('.know');
    const q = card ? card.dataset.q : null;
    if (!q) return;
    state.openKnow = state.openKnow === q ? null : q;
    render();
    return;
  }

  if (act === 'knowDone'){
    e.stopPropagation();
    const card = t.closest('.know');
    const q = card ? card.dataset.q : null;
    if (!q) return;
    const done = Store.getKnowDone();
    const i = done.indexOf(q);
    if (i < 0){ done.push(q); Store.ensureSchedule('work', q); }
    else done.splice(i, 1);
    Store.setKnowDone(done);
    toast(i < 0 ? '已标记掌握' : '已取消');
    render();
    return;
  }

  if (act === 'thinkToggle'){
    const card = t.closest('.know');
    const name = card ? card.dataset.think : null;
    if (!name) return;
    state.openThink = state.openThink === name ? null : name;
    if (state.openThink !== name) state.thinkHint = null;
    render();
    return;
  }
  if (act === 'thinkHint'){
    e.stopPropagation();
    const name = t.dataset.name;
    state.thinkHint = state.thinkHint === name ? null : name;
    render();
    return;
  }

  if (act === 'valveCat'){ state.valveCat = t.dataset.cat; state.searchQuery = ''; state.openKnow = null; render(); return; }
  if (act === 'searchClear'){ state.searchQuery = ''; render(); return; }
  if (act === 'markPassageDone'){ Store.markTodayDone('passage'); render(); toast('已记录'); return; }
  if (act === 'removeStudyPlan'){ Store.removeStudyPlan(+t.dataset.idx); render(); return; }

  if (act === 'linkToStudy'){
    const idx = +t.dataset.idx;
    const records = LS.get('work-records', []);
    const rec = records[idx];
    if (rec){ Store.linkWorkToStudy(rec); toast('已加入学习计划'); render(); }
    return;
  }

  /* ============================================================
     askAbout —— 关键修复：
     原来用 t.closest('[data-q]')，但按钮自己也有 data-q，
     所以 closest 返回按钮本身，找不到 textarea。
     改用 t.closest('.know') 定位外层卡片。
     ============================================================ */
  if (act === 'askAbout'){
    e.stopPropagation();
    const q = t.dataset.q;
    const card = t.closest('.know') || t.closest('.card');
    if (!card){ toast('找不到卡片'); return; }
    const input = card.querySelector('[data-qa-q]');
    const question = (input && input.value || '').trim();
    if (!question){ toast('先输入问题'); return; }
    if (!AI.enabled()){ toast('请先在「我的」页配置 AI'); return; }
    LS.set('ask-text:' + q, question);
    state.aiAnsweringFor = q;
    state.aiLoading = true;
    render();
    try{
      const item = SEED.VALVE_ALL.find(v => v.q === q);
      const context = item ? `${item.cat}：${item.a} ${item.key}` : '';
      const answer = await AI.answerQuestion(question, context);
      LS.set('ask-cache:' + q, { question, answer: answer || '（没有返回内容）', t: Date.now() });
      toast('AI 已解答');
    }catch(err){
      LS.set('ask-cache:' + q, { question, answer: '调用失败：' + (err.message || '未知错误'), t: Date.now() });
      toast('调用失败');
    }
    state.aiLoading = false;
    state.aiAnsweringFor = null;
    render();
    return;
  }

  if (act === 'saveAskToNote'){
    e.stopPropagation();
    const q = t.dataset.q;
    const cache = LS.get('ask-cache:' + q, null);
    if (!cache) return;
    const cur = Store.getNote(q);
    const text = '【我的提问】' + cache.question + '\n\n【AI 解答】\n' + cache.answer;
    Store.setNote(q, cur ? (cur + '\n\n' + text) : text);
    toast('已记入笔记');
    render();
    return;
  }
  if (act === 'clearAsk'){ LS.del('ask-cache:' + t.dataset.q); render(); return; }

  if (act === 'startReview'){
    e.stopPropagation();
    const type = t.dataset.type;
    if (type === 'english'){
      toast('加载复习数据…');
      try {
        await DeckLoader.ensureForReview();
      } catch(err){ console.warn(err); }
      const keys = Store.getDueKeys('english');
      const list = keys.map(k => DeckLoader.findWord(k)).filter(Boolean);
      if (!list.length){ toast('暂时没有需要复习的'); return; }
      startReview(type, list);
    } else {
      const keys = Store.getDueKeys('work');
      const list = keys.map(k => SEED.VALVE_ALL.find(v => v.q === k)).filter(Boolean);
      if (!list.length){ toast('暂时没有需要复习的'); return; }
      startReview(type, list);
    }
    return;
  }
  if (act === 'startWeekly'){ startWeeklyTest(); return; }
  if (act === 'reviewWrong'){
    const list = Store.getWrongBook().filter(x => x.type === 'work').map(x => SEED.VALVE_ALL.find(v => v.q === x.key)).filter(Boolean);
    if (!list.length){ toast('错题本是空的'); return; }
    startReview('work', list);
    return;
  }

  if (act === 'togglePassage'){ state.passageHidden = !state.passageHidden; render(); return; }
  if (act === 'speakPassage'){
    const title = t.dataset.title;
    const p = SEED.EXPRESS_PASSAGES.find(x => x.title === title);
    if (p) toggleSpeak(p.text, 'zh-CN', t);
    return;
  }

  if (act === 'gradeAnswer'){
    e.stopPropagation();
    const scene = t.dataset.scene;
    const q = t.dataset.q;
    const guide = t.dataset.guide;
    const ta = document.getElementById('exprAnswer');
    const answer = (ta && ta.value || '').trim();
    if (!answer){ toast('先写下你的回答'); return; }
    if (answer.length < 20){ toast('至少写两句'); return; }
    if (!AI.enabled()){ toast('请先在「我的」页配置 AI'); return; }
    const key = 'expr-' + scene + '-' + q;
    LS.set('expr-ans:' + key, answer);
    t.disabled = true;
    t.textContent = '⏳ AI 评分中…';
    const resultEl = document.getElementById('gradeResult');
    if (resultEl) resultEl.innerHTML = `<div style="margin-top:12px;padding:14px;background:#f8f9fd;border-radius:12px;font-size:13px;color:var(--sub);text-align:center;">AI 正在评分…</div>`;
    try{
      const result = await AI.gradeExpression(scene, q, guide, answer);
      if (result){
        LS.set('expr-grade:' + key, result);
        if (resultEl) resultEl.innerHTML = renderGradeCard(result);
        toast('评分完成');
      } else {
        if (resultEl) resultEl.innerHTML = renderGradeCard({ error:'AI 没有返回内容' });
      }
    }catch(err){
      if (resultEl) resultEl.innerHTML = renderGradeCard({ error:'调用失败：' + (err.message || '未知错误') });
    }finally{
      t.disabled = false;
      t.textContent = '🔄 重新评分';
    }
    return;
  }
  if (act === 'clearExprAnswer'){
    if (!confirm('清空这次回答和评分？')) return;
    const key = 'expr-' + t.dataset.scene + '-' + t.dataset.q;
    LS.del('expr-ans:' + key);
    LS.del('expr-grade:' + key);
    toast('已清空');
    render();
    return;
  }

  if (act === 'recCat'){ state.recommendCat = t.dataset.cat; render(); return; }

  if (act === 'openApp'){
    e.stopPropagation();
    const scheme = t.dataset.scheme;
    const name = t.dataset.name;
    const cat = t.dataset.cat;
    const idx = +t.dataset.idx;
    const item = (SEED.RECOMMEND[cat] || [])[idx] || {};
    const pkg = item.packageName || '';
    if (!scheme){ toast('这个 App 没有配置'); return; }
    const schemeName = scheme.replace(/:\/\/.*$/, '');
    copyText(name).then(() => toast('关键词已复制：' + name));
    if (window.AndroidBridge && typeof window.AndroidBridge.openUrl === 'function'){
      try{
        if (pkg){
          const intentUrl = `intent://#Intent;scheme=${schemeName};package=${pkg};end`;
          if (window.AndroidBridge.openUrl(intentUrl)){ toast('正在打开 ' + name + '…'); return; }
        }
        if (window.AndroidBridge.openUrl(scheme)){ toast('正在打开 ' + name + '…'); return; }
      }catch(err){ console.warn('Bridge openUrl 失败：', err); }
    }
    if (pkg){
      try{
        const fallback = item.web ? item.web(name) : '';
        const intentUrl = `intent://#Intent;scheme=${schemeName};package=${pkg};` +
          (fallback ? `S.browser_fallback_url=${encodeURIComponent(fallback)};` : '') + 'end';
        const a = document.createElement('a');
        a.href = intentUrl;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => a.remove(), 200);
        return;
      }catch(err){ console.warn('intent:// 失败：', err); }
    }
    try{
      const a = document.createElement('a');
      a.href = scheme;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => a.remove(), 200);
      return;
    }catch(err){ console.warn('裸 scheme 失败：', err); }
    toast('App 未安装或无法唤起，已打开网页版');
    if (item.web) openExternal(item.web(name));
    return;
  }

  if (act === 'openWeb'){
    e.stopPropagation();
    const cat = t.dataset.cat;
    const idx = +t.dataset.idx;
    const list = SEED.RECOMMEND[cat] || [];
    const r = list[idx];
    if (r && r.web) openExternal(r.web(r.name));
    return;
  }

  if (act === 'saveGrowth'){
    const growth = Store.getGrowth() || {};
    const refl = document.getElementById('growthReflection');
    const tomorrow = document.getElementById('growthTomorrow');
    growth.reflection = refl ? refl.value : '';
    growth.tomorrow = tomorrow ? tomorrow.value : '';
    Store.setGrowth(growth);
    Store.pushGrowthLog({ date: todayStr(), reflection: growth.reflection, tomorrow: growth.tomorrow, t: Date.now() });
    toast('已保存');
    return;
  }

  if (act === 'saveWorkRecord'){
    const p = document.getElementById('workProblem');
    const s = document.getElementById('workSolution');
    const k = document.getElementById('workKeywords');
    const rec = { date: todayStr(), problem: p ? p.value.trim() : '', solution: s ? s.value.trim() : '', keywords: k ? k.value.trim() : '' };
    if (!rec.problem){ toast('先写下问题'); return; }
    LS.set('work-record-' + todayStr(), rec);
    const list = LS.get('work-records', []);
    const filtered = list.filter(x => x.date !== rec.date);
    filtered.unshift(rec);
    LS.set('work-records', filtered.slice(0, 200));
    toast('已保存');
    render();
    return;
  }

  if (act === 'quickAsk'){
    if (!AI.enabled()){ toast('请先在「我的」页配置 AI'); return; }
    Store.addAIHistory('user', t.dataset.prompt);
    state.aiLoading = true;
    openAIAssistant();
    try{
      const answer = await AI.assistant(t.dataset.prompt, state.aiRole);
      Store.addAIHistory('bot', answer || '（无返回）');
    }catch(e){
      Store.addAIHistory('bot', '调用失败：' + (e.message || '未知错误'));
    }
    state.aiLoading = false;
    openAIAssistant();
    return;
  }

  if (act === 'aiSend'){ sendAIMessage(); return; }
  if (act === 'aiRole'){ state.aiRole = t.dataset.role; LS.set('ai-role', state.aiRole); openAIAssistant(); return; }
  if (act === 'clearAIHistory'){
    if (confirm('清空所有 AI 对话历史？')){ Store.clearAIHistory(); openAIAssistant(); }
    return;
  }

  if (act === 'setAccent'){ LS.set('voice-accent', t.dataset.accent); render(); return; }
  if (act === 'setSpeed'){ LS.set('voice-speed', +t.dataset.speed); render(); return; }

  if (act === 'diagTTS'){ toggleSpeak('Hello, this is a test. 测试朗读。', 'en-US'); return; }
  if (act === 'diagOnline'){ playOnlineTTS('Hello, this is an online TTS test.', 'en-US'); return; }
  if (act === 'diagScheme'){
    const a = document.createElement('a');
    a.href = 'weread://';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 200);
    toast('已尝试打开微信读书。无反应=WebView 拦截了 scheme');
    return;
  }

  if (act === 'exportData'){ doExport(); return; }
  if (act === 'importData'){ doImport(); return; }

  if (act === 'saveAI'){
    const provider = document.getElementById('aiProvider').value;
    const key = document.getElementById('aiKey').value.trim();
    const model = document.getElementById('aiModel').value.trim();
    const customBase = document.getElementById('aiCustomBase').value.trim();
    if (provider !== 'none' && !key){ toast('请填入 API Key'); return; }
    AI.set(provider, key, model, customBase);
    toast(provider === 'none' ? '已关闭 AI' : '已保存');
    render();
    return;
  }

  if (act === 'clearData'){
    if (confirm('确定清空本设备所有学习进度？建议先导出备份。')){
      Store.clearAll();
      toast('已清空');
      setTimeout(() => location.reload(), 500);
    }
    return;
  }

  if (act === 'globalSearchJump'){ handleSearchJump(t.dataset.type, +t.dataset.idx); return; }
});

sheet.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'closeSheet'){ closeSheet(); return; }
  if (act === 'reviewSpeak'){ toggleSpeak(t.dataset.text, t.dataset.lang || 'en-US', t); return; }
  if (act === 'reviewSubmit'){ submitReviewAnswer(); return; }
  if (act === 'rate'){ rateAndNext(t.dataset.rating); return; }
  if (act === 'aiRole'){ state.aiRole = t.dataset.role; LS.set('ai-role', state.aiRole); openAIAssistant(); return; }
  if (act === 'clearAIHistory'){ if (confirm('清空所有 AI 对话历史？')){ Store.clearAIHistory(); openAIAssistant(); } return; }
  if (act === 'aiSend'){ sendAIMessage(); return; }
  if (act === 'globalSearchJump'){ handleSearchJump(t.dataset.type, +t.dataset.idx); return; }
  if (act === 'copyExport'){
    const ta = document.getElementById('exportText');
    if (ta){
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      copyText(ta.value).then(ok => toast(ok ? '已复制到剪贴板' : '复制失败，请长按选择'));
    }
    return;
  }
  if (act === 'doImportConfirm'){
    const ta = document.getElementById('importText');
    const text = (ta && ta.value || '').trim();
    if (!text){ toast('请粘贴备份文本'); return; }
    try{
      Store.importDataFromText(text);
      toast('导入成功，正在刷新…');
      closeSheet();
      setTimeout(() => location.reload(), 700);
    }catch(err){
      toast('格式不对：' + err.message);
    }
    return;
  }
});

tabbar.addEventListener('click', (e) => {
  const t = e.target.closest('.tab');
  if (!t) return;
  stopSpeak();
  state.tab = t.dataset.tab;
  render();
});
fab.addEventListener('click', () => openAIAssistant());
document.getElementById('globalSearchBtn').addEventListener('click', openGlobalSearch);

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.querySelector('.phone').appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 1900);
}

/* ============================================================
   启动
   ============================================================ */
(function init(){
  loadDataFromGlobals();
  Store.checkIn();
  render();
})();
</script>
</body>
</html>
